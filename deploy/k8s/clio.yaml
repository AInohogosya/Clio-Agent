# Clio Agent 3.1 on Kubernetes: the seven services, as deployments.
#
# One honest note up front: there is no `clio-supervisor` pod here. The
# supervisor's job — start, watch, recycle — is the Deployment controller's
# in a cluster, and running both would be two processes restarting each
# other's children. `clio-supervisor` is the compose/systemd deployment's
# orchestrator; Kubernetes uses its own.
#
# Scaling boundaries, per the architecture:
#   clio-api        stateless, N replicas (all state is PostgreSQL + RLS)
#   clio-workers-*  horizontally scalable via atomic (leaseOwner, leaseFence)
#                   claims; raise `replicas` to raise parallelism
#   clio-gateway    ONE replica: it is the sole credential holder and the
#                   spend guard's serialization point
#   clio-toolhost   ONE replica today (screen/PTY/kernel state is per-process)
#   clio-comms      ONE replica, with the per-channel advisory lock inside
#   clio-core       ONE replica (the single Self)
#
# Secrets are managed by you (SealedSecrets, External Secrets, or a hand-made
# Secret named below). CLIO_MASTER_KEY must be a stable 32-byte hex value:
# losing it loses every sealed payload, by design.
apiVersion: v1
kind: Secret
metadata:
  name: clio-secrets
  namespace: clio
stringData:
  CLIO_DSN: postgresql://clio:clio@clio-db:5432/clio
  CLIO_MASTER_KEY: "replace-with-32-bytes-of-hex"
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
---
apiVersion: v1
kind: Namespace
metadata:
  name: clio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clio-db
  namespace: clio
spec:
  serviceName: clio-db
  replicas: 1
  selector:
    matchLabels: { app: clio-db }
  template:
    metadata:
      labels: { app: clio-db }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_USER
              value: clio
            - name: POSTGRES_PASSWORD
              value: clio
            - name: POSTGRES_DB
              value: clio
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "clio", "-d", "clio"] }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: clio-db, namespace: clio }
spec:
  selector: { app: clio-db }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# ---- the Self: life loop, attention, focus scheduler, GSL orchestration ----
apiVersion: apps/v1
kind: Deployment
metadata: { name: clio-core, namespace: clio }
spec:
  replicas: 1                       # the single Self; never scale this
  strategy: { type: Recreate }      # no two Selves, not even during a rollout
  selector:
    matchLabels: { app: clio-core }
  template:
    metadata:
      labels: { app: clio-core }
    spec:
      containers:
        - name: core
          image: ghcr.io/ainohogosya/clio:3.1
          command: ["python", "-m", "clio", "core"]
          envFrom: [{ secretRef: { name: clio-secrets } }]
          env:
            - { name: CLIO_SANDBOX_BACKEND, value: filesystem }   # pod = the boundary
          volumeMounts:
            - { name: home, mountPath: /home/clio/.ethos }
          livenessProbe:
            exec:
              command: ["sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /home/clio/.ethos/run/heartbeat) )) -lt 1800"]
            periodSeconds: 30
      volumes:
        - name: home
          persistentVolumeClaim: { claimName: clio-home }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: clio-home, namespace: clio }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 100Gi } }
---
# ---- the sole credential holder and spend guard ----
apiVersion: apps/v1
kind: Deployment
metadata: { name: clio-gateway, namespace: clio }
spec:
  replicas: 1
  selector:
    matchLabels: { app: clio-gateway }
  template:
    metadata:
      labels: { app: clio-gateway }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/ainohogosya/clio:3.1
          command: ["python", "-m", "clio", "gateway"]
          envFrom: [{ secretRef: { name: clio-secrets } }]
          ports: [{ containerPort: 8700 }]
          volumeMounts:
            - { name: home, mountPath: /home/clio/.ethos }
      volumes:
        - name: home
          persistentVolumeClaim: { claimName: clio-home }
---
# ---- tool execution under the guardian gate ----
apiVersion: apps/v1
kind: Deployment
metadata: { name: clio-toolhost, namespace: clio }
spec:
  replicas: 1
  selector:
    matchLabels: { app: clio-toolhost }
  template:
    metadata:
      labels: { app: clio-toolhost }
    spec:
      containers:
        - name: toolhost
          image: ghcr.io/ainohogosya/clio:3.1
          command: ["python", "-m", "clio", "toolhost"]
          envFrom: [{ secretRef: { name: clio-secrets } }]
          ports: [{ containerPort: 8701 }]
          volumeMounts:
            - { name: home, mountPath: /home/clio/.ethos }
      volumes:
        - name: home
          persistentVolumeClaim: { claimName: clio-home }
---
# ---- channel doors; one poller per channel via advisory locks ----
apiVersion: apps/v1
kind: Deployment
metadata: { name: clio-comms, namespace: clio }
spec:
  replicas: 1
  selector:
    matchLabels: { app: clio-comms }
  template:
    metadata:
      labels: { app: clio-comms }
    spec:
      containers:
        - name: comms
          image: ghcr.io/ainohogosya/clio:3.1
          command: ["python", "-m", "clio", "comms"]
          envFrom: [{ secretRef: { name: clio-secrets } }]
          volumeMounts:
            - { name: home, mountPath: /home/clio/.ethos }
      volumes:
        - name: home
          persistentVolumeClaim: { claimName: clio-home }
---
# ---- delegated work; scale this number for parallelism ----
apiVersion: apps/v1
kind: Deployment
metadata: { name: clio-workers, namespace: clio }
spec:
  replicas: 2                       # raise to raise parallelism
  selector:
    matchLabels: { app: clio-workers }
  template:
    metadata:
      labels: { app: clio-workers }
    spec:
      containers:
        - name: worker
          image: ghcr.io/ainohogosya/clio:3.1
          command: ["python", "-m", "clio", "worker"]
          envFrom: [{ secretRef: { name: clio-secrets } }]
          env:
            # The pod name becomes the lease owner, so a recycled worker's
            # fence is per-pod and transfers are traceable.
            - name: CLIO_PROCESS_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: home, mountPath: /home/clio/.ethos }
      volumes:
        - name: home
          persistentVolumeClaim: { claimName: clio-home }
---
# ---- stateless control plane; scale freely behind the Service ----
apiVersion: apps/v1
kind: Deployment
metadata: { name: clio-api, namespace: clio }
spec:
  replicas: 2
  selector:
    matchLabels: { app: clio-api }
  template:
    metadata:
      labels: { app: clio-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/ainohogosya/clio:3.1
          command: ["python", "-m", "clio", "api"]
          envFrom: [{ secretRef: { name: clio-secrets } }]
          ports: [{ containerPort: 8721 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 8721 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata: { name: clio-api, namespace: clio }
spec:
  selector: { app: clio-api }
  ports: [{ port: 8721, targetPort: 8721 }]
