name: clio-main

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clio-db
    environment:
      POSTGRES_USER: clio
      POSTGRES_PASSWORD: clio
      POSTGRES_DB: clio
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - clio_main_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clio -d clio"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clio_main_pgdata:
