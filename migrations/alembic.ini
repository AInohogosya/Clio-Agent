[alembic]
# `%(here)s` is the directory holding this file, so the migrations run from any
# working directory: a relative path would resolve against wherever the caller
# happened to be standing and turn `python -m ethos db upgrade` into a
# cwd-dependent command.
script_location = %(here)s
sqlalchemy.url = postgresql+asyncpg://ethos:ethos@127.0.0.1:5433/ethos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
