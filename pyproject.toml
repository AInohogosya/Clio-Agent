[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clio_agent-cli"
version = "3.0.0"
description = "Autonomous loop AI-powered terminal automation system"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AInohogosya", email = "maintainers@clio-project.org"},
]
maintainers = [
    {name = "Clio Project Maintainers", email = "maintainers@clio-project.org"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Automation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = [
    "ai", "automation", "cli", "terminal", "command-line",
    "llm", "agent", "autonomous", "telegram", "discord"
]
requires-python = ">=3.8"
dependencies = [
    "Pillow>=10.0.0; python_version < '3.13'",
    "Pillow>=11.0.0; python_version >= '3.13'",
    "requests>=2.31.0",
    "numpy>=1.24.0; python_version < '3.12'",
    "numpy>=1.26.0; python_version >= '3.12' and python_version < '3.13'",
    "numpy>=2.1.0; python_version >= '3.13'",
    "structlog>=23.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0.0",
    "pluggy>=1.0.0",
    "ollama>=0.1.0",
    "openai>=1.0.0",
    "pyautogui>=0.9.54; sys_platform=='darwin'",
    "pyobjc-framework-Cocoa>=9.0; sys_platform=='darwin'",
    "pywin32>=306; sys_platform=='win32'",
    "python-xlib>=0.33; sys_platform=='linux'",
]

[project.optional-dependencies]
cloud = [
    "anthropic>=0.25.0",
    "google-genai>=0.3.0",
    "mistralai>=0.1.0",
    "boto3>=1.34.0",
    "cohere>=5.0.0",
]
bot = [
    "python-telegram-bot>=21.0.0",
    "discord.py>=2.3.0",
]
groq = ["groq>=0.5.0"]
all = [
    "anthropic>=0.25.0",
    "google-genai>=0.3.0",
    "mistralai>=0.1.0",
    "boto3>=1.34.0",
    "cohere>=5.0.0",
    "python-telegram-bot>=21.0.0",
    "discord.py>=2.3.0",
    "groq>=0.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "flake8-bugbear>=23.0.0",
    "flake8-comprehensions>=3.12.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "pip-audit>=2.6.0",
    "twine>=4.0.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/clio-project/Clio-Agent-1"
Repository = "https://github.com/clio-project/Clio-Agent-1"
Documentation = "https://github.com/clio-project/Clio-Agent-1/tree/main/docs"
"Bug Reports" = "https://github.com/clio-project/Clio-Agent-1/issues"
"Feature Requests" = "https://github.com/clio-project/Clio-Agent-1/issues/new/choose"
"Discussions" = "https://github.com/clio-project/Clio-Agent-1/discussions"
Changelog = "https://github.com/clio-project/Clio-Agent-1/blob/main/CHANGELOG.md"
"Security Policy" = "https://github.com/clio-project/Clio-Agent-1/blob/main/SECURITY.md"

[project.scripts]
"Clio-Agent" = "clio_agent:main"
"clio-agent" = "clio_agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  # directories
  \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | build
  | dist
)
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
follow_imports = "silent"
namespace_packages = true
show_error_codes = true
pretty = true

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PT",  # pytest-specific
    "PIE", # flake8-pie
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E203",  # whitespace before ':' (conflicts with black)
    "B008",  # do not perform function calls in argument defaults (too strict)
]
per-file-ignores = { "tests/*" = ["S101", "PT011"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_agent = [
    "config/*.yaml",
    "config/*.json",
    "templates/*.txt",
    "scripts/*.sh",
    "scripts/*.ps1",
]