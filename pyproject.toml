[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clio-agent-2"
version = "1.0.0"
description = "A fully functional, autonomous AI agent with multi-platform support (CLI, Telegram, Discord, WhatsApp)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.5.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "python-telegram-bot>=20.0",
    "discord.py>=2.0.0",
    "pywa>=1.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.6.0",
]
google = ["google-generativeai>=0.3.0"]
anthropic = ["anthropic>=0.18.0"]
all = [
    "google-generativeai>=0.3.0",
    "anthropic>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/your-org/Clio-Agent-2"
Repository = "https://github.com/your-org/Clio-Agent-2"
Issues = "https://github.com/your-org/Clio-Agent-2/issues"
Documentation = "https://github.com/your-org/Clio-Agent-2/tree/main/docs"
Changelog = "https://github.com/your-org/Clio-Agent-2/blob/main/CHANGELOG.md"

[project.scripts]
clio-agent = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clio_agent_2*"]

[tool.ruff]
target-version = "py38"
line-length = 100
indent-width = 4
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "T20", # print statements
    "PIE", # flake8-pie
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "SIM103", # avoid `return` in `else` branch
    "T201",  # print() is used in CLI-facing scripts and utilities
    "W293",  # blank line whitespace is acceptable in this project
    "UP045", # Optional[...] annotations are still used in this project
    "SIM105", # suppress() patterns are not required here
]
exclude = [
    ".venv",
    "venv",
    "env",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "dist",
    "build",
    "*.egg-info",
    "node_modules",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true
exclude = [
    "^\\.venv/",
    "^venv/",
    "^env/",
    "^__pycache__/",
    "^\\.mypy_cache/",
    "^dist/",
    "^build/",
    "^.*\\.egg-info/",
    "^node_modules/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["clio_agent_2"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = [".venv", "venv", "env", "tests", "__pycache__", "dist", "build"]
skips = ["B101", "B104", "B106", "B108", "B601"]