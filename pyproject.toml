[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ethos"
version = "3.0.0-beta.1"
description = "Clio Agent 3 Beta 1: a continuously existing, general-purpose autonomous agent"
requires-python = ">=3.12"
dependencies = [
    "uvloop>=0.19; sys_platform != 'win32'",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "anthropic>=0.34",
    "openai>=1.35",
    "google-genai>=0.3",
    "fastembed>=0.3",
    "playwright>=1.44",
    "bashlex>=0.18",
    "pyrage>=1.1",
    "structlog>=24.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "typer>=0.12",
    "python-telegram-bot>=21.1",
    "aioimaplib>=1.0",
    "aiosmtplib>=3.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
]

[project.scripts]
# `main`, not the Typer app object: the console script and `python -m ethos` then
# run the same function, so the `.env` file is read once on both paths and there
# is one entry point to read rather than two that differ in a way nothing records.
ethos = "ethos.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ethos", "migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120
markers = [
    "integration: requires a live PostgreSQL database",
    "scenario: end-to-end scenarios (requires a live PostgreSQL database)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["ethos"]
