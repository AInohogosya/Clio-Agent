  # Failover for a deployment whose OpenRouter key is on the free tier: the
  # paid entries above answer 403 "key limit exceeded" on such a key, so a
  # base model that hiccups would otherwise have nowhere left to fail over to
  # and land in `no_model_available`. Measured 5/5 valid JSON at the 2048-token
  # budget, ~4s. The other `:free` candidates were not: `gemma-4-31b-it` is
  # throttled to 429s and `lfm-2.5-2.6b` returns reasoning-only replies.
  - provider: openai_compat
    model: nvidia/nemotron-3.5-super-vl:free
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: OPENROUTER_API_KEY
    tiers: [T2]
    quality: 0.70
    latency_s: 4.5
    rpm: 20
    tpm: 100000
    supports_thinking: false
    supports_tools: true
    diversity_family: nvidia

  - provider: openai_compat
    model: llama-3.3-70b-versatile
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: GROQ_API_KEY
    tiers: [T1]
    quality: 0.58
    latency_s: 1.5
    rpm: 30
    tpm: 12000
    supports_thinking: false
    supports_tools: true
    diversity_family: meta

  # A model served on this machine by vLLM (or any OpenAI-compatible local
  # server). Two things worth knowing before editing this entry:
  #
  # * The port. 8000 is also what a dozen unrelated laptop apps bind by
  #   default, and a server that answers this URL with anything but a model
  #   catalogue will sit in every failover ladder as a candidate that can only
  #   answer 404. Move the entry to a port you actually own rather than
  #   trusting the default.
  # * The health check. The gateway asks every keyless loopback entry
  #   `GET /models` once at start-up; an endpoint that does not answer 200 is
  #   removed from the live catalogue (and logged as
  #   `gateway.local_endpoints_unavailable`) until the next restart, so start
  #   the local server before the agent.
  - provider: openai_compat
    model: local-vllm
    base_url: "http://127.0.0.1:8000/v1"
    api_key_env: ""
    tiers: [T1]
    quality: 0.50
    latency_s: 3.0
    rpm: 1000
    tpm: 1000000
    supports_thinking: false
    supports_tools: true
    diversity_family: local
