tiers:
  T1: { floor: 0.50 }
  T2: { floor: 0.70 }
  T3: { floor: 0.90 }

models:
  - provider: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    tiers: [T2, T3]
    quality: 0.93
    latency_s: 6.0
    rpm: 50
    tpm: 400000
    supports_thinking: true
    supports_tools: true
    diversity_family: anthropic

  - provider: anthropic
    model: claude-3-5-haiku-latest
    api_key_env: ANTHROPIC_API_KEY
    tiers: [T1, T2]
    quality: 0.78
    latency_s: 2.5
    rpm: 60
    tpm: 400000
    supports_thinking: false
    supports_tools: true
    diversity_family: anthropic

  - provider: openai
    model: o3
    api_key_env: OPENAI_API_KEY
    tiers: [T3]
    quality: 0.92
    latency_s: 8.0
    rpm: 40
    tpm: 300000
    supports_thinking: true
    supports_tools: true
    diversity_family: openai

