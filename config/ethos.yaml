self_name: Clio Agent 3 Beta
timezone: local

paths:
  home: "~/.ethos"
  workspace: "~/workspace"
  work: "~/work"
  toolshed: "~/toolshed"
  notes: "~/notes"
  trash: "~/.trash"
  snapshots: "~/.ethos/snapshots"
  threads: "~/work/.threads"

database:
  dsn: "postgresql://ethos:ethos@127.0.0.1:5433/ethos"
  min_pool: 2
  max_pool: 10
  command_timeout_s: 30
  connect_timeout_s: 3

gateway:
  socket_path: "/run/ethos/gateway.sock"
  host: "127.0.0.1"
  port: 8700
  routing:
    mu: 0.002
    nu: 0.01
  circuit_breaker:
    window_s: 60
    max_failures: 5
    min_calls: 20
    error_rate: 0.30
    cooldown_s: 30
  retry:
    max_retries: 5
    backoff_s: 1.5
    max_backoff_s: 30
    jitter: 0.3
    fail_over: true
  budget:
    commitment_reserve_pct: 0.50
  embedding:
    provider: fastembed
    # 1.2 GB of ONNX weights. The smallest model that keeps the vector width this
    # schema stores is `BAAI/bge-small-en-v1.5` at 0.067 GB — but it is 384
    # dimensional, so it also needs `dim: 384` below and a migration that widens
    # the columns, and memories already in the store were embedded by *this*
    # model. `ETHOS_EMBEDDING=hashing` needs no model at all and no width.
    model: "BAAI/bge-large-en-v1.5"
    dim: 1024
    # ONNX intra-op threads. `None` (fastembed's default) sizes the arena to the
    # core count; one thread per session is what this workload actually needs.
    threads: 1
    # Empty means `<data_dir>/models/fastembed`. Set it to keep the weights on a
    # mounted volume so a restart does not download 1.2 GB again.
    cache_dir: ""

workers:
  count: 2

threads:
  max_concurrent: 4
  max_depth: 2
  mode: inprocess

journal:
  backend: db
