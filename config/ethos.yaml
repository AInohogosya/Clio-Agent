self_name: Clio Agent 3
timezone: local

paths:
  home: "~/.ethos"
  workspace: "~/workspace"
  work: "~/work"
  toolshed: "~/toolshed"
  notes: "~/notes"
  trash: "~/.trash"
  snapshots: "~/.ethos/snapshots"
  threads: "~/work/.threads"

database:
  dsn: "postgresql://ethos:ethos@127.0.0.1:5433/ethos"
  min_pool: 2
  max_pool: 10
  command_timeout_s: 30
  connect_timeout_s: 3

gateway:
  socket_path: "/run/ethos/gateway.sock"
  host: "127.0.0.1"
  port: 8700
  routing:
    mu: 0.002
    nu: 0.01
  circuit_breaker:
    window_s: 60
    max_failures: 5
    min_calls: 20
    error_rate: 0.30
    cooldown_s: 30
  retry:
    max_retries: 5
    backoff_s: 1.5
    max_backoff_s: 30
    jitter: 0.3
    fail_over: true
  budget:
    commitment_reserve_pct: 0.50
  embedding:
    provider: fastembed
    # 1.2 GB of ONNX weights. The smallest model that keeps the vector width this
    # schema stores is `BAAI/bge-small-en-v1.5` at 0.067 GB — but it is 384
    # dimensional, so it also needs `dim: 384` below and a migration that widens
    # the columns, and memories already in the store were embedded by *this*
    # model. `ETHOS_EMBEDDING=hashing` needs no model at all and no width.
    model: "BAAI/bge-large-en-v1.5"
    dim: 1024
    # ONNX intra-op threads. `None` (fastembed's default) sizes the arena to the
    # core count; one thread per session is what this workload actually needs.
    threads: 1
    # Empty means `<data_dir>/models/fastembed`. Set it to keep the weights on a
    # mounted volume so a restart does not download 1.2 GB again.
    cache_dir: ""

workers:
  count: 2

threads:
  max_concurrent: 4
  max_depth: 2
  mode: inprocess

# External agent programs wired in as sub-agents. Each one keeps its own
# identity and interface; every model call they make is routed through this
# agent's gateway, so `models.yaml`, the spend guard, retries and the base
# model above apply to them exactly as they apply to the Self.
subagents:
  # The gateway URL sub-agents reach this agent's model routing on. Empty
  # derives it from the `gateway` section above.
  gateway_url: ""
  # The model name sub-agents send on the OpenAI-compatible wire. Empty means
  # the base model's name, so they inherit it.
  model_name: ""
  tier: T2
  agents:
    - name: foundry
      # Deterministic, gate-verified software factory. Takes a product
      # objective in plain text, designs and plans it through an LLM, then
      # runs every task through a fixed state machine with sandboxed gates,
      # merge trains and signed artifacts.
      mode: auto
      root: ""
      # The repository Foundry works on. Empty means the thread's own
      # isolated worktree.
      repo_root: ""
      timeout_s: 3600.0
    - name: apex
      # Revision-aware hybrid desktop controller. Takes a natural-language
      # desktop goal, observes the real desktop, proposes one fenced step at
      # a time, executes and machine-verifies it until the goal is done.
      mode: auto
      root: ""
      timeout_s: 900.0

