sudo_allowed: true

network:
  allowed_hosts: []
  # Open in the field: an agent doing a person's whole job needs the LAN --
  # local dev servers, self-hosted dashboards, printers, NAS boxes -- not
  # just the public internet. Set back to true to confine it to public
  # hosts.
  deny_private_ranges: false
  max_response_bytes: 10485760

secrets:
  allowed_domains: []

interruption:
  # High in the field: these were sized for a chatty assistant, and for an
  # agent that is the *only* channel of its owner's work a low cap reads as
  # "the agent went quiet halfway through the day".
  daily_budgets:
    owner: 999
    collaborator: 500
    other: 200
  # A zero-length window: quiet hours are off. An agent carrying someone's
  # working day answers when the work says so (critical urgency always
  # could). Set a real window to bring nights back.
  quiet_hours:
    start: "00:00"
    end: "00:00"
  digest_window_min: 120
  # How long the agent's own last word on a conversation counts as unanswered,
  # and therefore as a reason not to open a new subject on it.
  awaiting_reply_h: 12
  # How long the same words are recognised as the same words.
  repeat_window_h: 24
  # A send that names the intention it is about -- a solver step reporting on
  # work in flight -- skips the digest window and the 12h unanswered check, and
  # is delivered when written. The gates those two sit behind assume the agent is
  # opening a conversation, which is the wrong shape for a note about work that
  # was already commissioned. Quiet hours, the daily budget above, and
  # repeat_window_h all still apply. Set false to batch mid-task updates like any
  # other unsolicited message.
  midtask_sends_immediate: true
  urgency_classes: [low, normal, high, critical]

guardian:
  # "field" (default): the guardian keeps its records and its reversibility
  # work -- journal, trash, snapshots -- and drops its vetoes. The pattern
  # block, the money-cap rejection and the due-process model check become
  # audit entries and the action proceeds. "normal" restores the vetoing
  # gate. ETHOS_GUARDIAN_MODE overrides this file. Oversight (pause/stop,
  # preview) is effective in both modes.
  mode: field
  fast_path_retention_days: 30
  due_process_retention_days: 180
  snapshot_policy:
    minutes_15: 4
    hourly: 24
    daily: 7

hard_limits:
  H1_oversight_supremacy: true
  H2_daily_spend_usd: 20.0
  H2_monthly_spend_usd: 400.0
  H2_capital_at_risk_usd: 100.0
  money_threshold_usd: 5.0
  H3_law_and_non_harm: true
  H4_legal_authority: true
  H5_commissioned_due_process: true
  H6_credential_scope: true
  # "warn": the caps above are advisories -- a breach is logged loudly and
  # shown on the dashboard, and no model call is refused. "block" restores
  # the hard raise. ETHOS_BUDGET_MODE overrides this file.
  on_exceed: warn
